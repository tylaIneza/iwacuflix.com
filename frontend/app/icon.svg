<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>

  <!-- Subtle red glow layer -->
  <rect width="32" height="32" rx="7" fill="#E50914" opacity="0.06"/>

  <!-- Top serif bar -->
  <rect x="6" y="6" width="20" height="5" rx="2.5" fill="#E50914"/>

  <!-- Vertical stem -->
  <rect x="14" y="11" width="4" height="10" fill="#E50914"/>

  <!-- Bottom serif bar -->
  <rect x="6" y="21" width="20" height="5" rx="2.5" fill="#E50914"/>

  <!-- Tiny film-strip dots top-left and top-right for style -->
  <rect x="6"  y="6" width="2" height="2" rx="1" fill="#fff" opacity="0.15"/>
  <rect x="24" y="6" width="2" height="2" rx="1" fill="#fff" opacity="0.15"/>
  <rect x="6"  y="24" width="2" height="2" rx="1" fill="#fff" opacity="0.15"/>
  <rect x="24" y="24" width="2" height="2" rx="1" fill="#fff" opacity="0.15"/>
</svg>
